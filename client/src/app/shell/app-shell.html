<div class="desk-stage">
  <span class="desk-light" aria-hidden="true"></span>
  <span class="desk-ruler" aria-hidden="true"></span>
  <span class="desk-pencil" aria-hidden="true"></span>
  <span class="desk-paperclip" aria-hidden="true"></span>
</div>
<button
  class="desk-lamp"
  type="button"
  aria-label="Toggle desk lamp between Day and Night"
  (click)="toggleDeskLamp()"
>
  <span aria-hidden="true"></span>
</button>
<header class="site-header">
  <a class="brand" [routerLink]="paths.home" aria-label="Sisu Steps home">
    <span class="brand-mark" aria-hidden="true">S</span>
    <span><strong>Sisu Steps</strong><small>Finnish exercise book</small></span>
  </a>
  <div class="header-tools">
    <fieldset class="appearance-control">
      <legend class="visually-hidden">Appearance</legend>
      <div
        class="appearance-switch"
        [class.day-selected]="appearance === 'light'"
        [class.automatic-selected]="appearance === 'automatic'"
        [class.night-selected]="appearance === 'dark'"
      >
        <span class="appearance-toggle-hardware" aria-hidden="true"></span>
        <div class="appearance-options">
          <label [class.selected]="appearance === 'light'">
            <input
              type="radio"
              name="appearance"
              value="light"
              [checked]="appearance === 'light'"
              (change)="changeAppearance('light')"
            />
            <svg class="appearance-choice-icon day-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path
                d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"
              ></path>
            </svg>
            <span class="visually-hidden">Day</span>
          </label>
          <label [class.selected]="appearance === 'automatic'">
            <input
              type="radio"
              name="appearance"
              value="automatic"
              [checked]="appearance === 'automatic'"
              (change)="changeAppearance('automatic')"
            />
            <svg
              class="appearance-choice-icon automatic-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="8"></circle>
              <path d="M12 4a8 8 0 0 1 0 16Z"></path>
            </svg>
            <span class="visually-hidden">Automatic</span>
          </label>
          <label [class.selected]="appearance === 'dark'">
            <input
              type="radio"
              name="appearance"
              value="dark"
              [checked]="appearance === 'dark'"
              (change)="changeAppearance('dark')"
            />
            <svg class="appearance-choice-icon night-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19 15.3A8 8 0 0 1 8.7 5 8 8 0 1 0 19 15.3Z"></path>
            </svg>
            <span class="visually-hidden">Night</span>
          </label>
        </div>
      </div>
    </fieldset>
  </div>
</header>
<div class="workbook-folder">
  <div class="workbook-cover" aria-hidden="true"></div>
  <nav class="workbook-folder-tabs" aria-label="Primary navigation">
    <a
      class="workbook-folder-tab tab-blue"
      [routerLink]="paths.home"
      [routerLinkActiveOptions]="{ exact: true }"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      ><span>Topics</span></a
    >
    <a
      class="workbook-folder-tab tab-white"
      [routerLink]="paths.reports"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      ><span>Reports</span></a
    >
    <a
      class="workbook-folder-tab tab-yellow"
      [routerLink]="paths.data"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      ><span>Data &amp; backup</span></a
    >
  </nav>
  <router-outlet (activate)="focusRoutedContent()" />
  <div class="workbook-page-hardware" aria-hidden="true">
    <span class="workbook-page-clip"></span>
  </div>
</div>
<footer class="site-footer">
  <p><strong>Sisu Steps</strong> · Your progress stays safely in this browser.</p>
  <p>Quiet study · one step at a time</p>
</footer>
