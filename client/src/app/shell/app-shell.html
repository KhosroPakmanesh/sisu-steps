<div class="desk-stage" aria-hidden="true">
  <span class="desk-lamp"><span></span></span>
  <span class="desk-light"></span>
  <span class="desk-ruler"></span>
  <span class="desk-pencil"></span>
  <span class="desk-paperclip"></span>
</div>
<header class="site-header">
  <a class="brand" [routerLink]="paths.home" aria-label="Sisu Steps home">
    <span class="brand-mark" aria-hidden="true">S</span>
    <span><strong>Sisu Steps</strong><small>Finnish exercise book</small></span>
  </a>
  <div class="header-tools">
    <nav aria-label="Primary navigation">
      <a
        [routerLink]="paths.home"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="active"
        >Topics</a
      >
      <a [routerLink]="paths.reports" routerLinkActive="active">Reports</a>
      <a [routerLink]="paths.data" routerLinkActive="active">Data & backup</a>
    </nav>
    <fieldset class="appearance-control">
      <legend class="visually-hidden">Appearance</legend>
      <div class="appearance-options">
        <label [class.selected]="appearance === 'automatic'">
          <input
            type="radio"
            name="appearance"
            value="automatic"
            [checked]="appearance === 'automatic'"
            (change)="changeAppearance('automatic')"
          />
          <span class="appearance-scene automatic" aria-hidden="true"><i></i></span>
          <span>Automatic</span>
        </label>
        <label [class.selected]="appearance === 'light'">
          <input
            type="radio"
            name="appearance"
            value="light"
            [checked]="appearance === 'light'"
            (change)="changeAppearance('light')"
          />
          <span class="appearance-scene day" aria-hidden="true"><i></i></span>
          <span>Day</span>
        </label>
        <label [class.selected]="appearance === 'dark'">
          <input
            type="radio"
            name="appearance"
            value="dark"
            [checked]="appearance === 'dark'"
            (change)="changeAppearance('dark')"
          />
          <span class="appearance-scene night" aria-hidden="true"><i></i></span>
          <span>Night</span>
        </label>
      </div>
    </fieldset>
  </div>
</header>
<router-outlet />
<footer class="site-footer">
  <p><strong>Sisu Steps</strong> · Your progress stays safely in this browser.</p>
  <p>Quiet study · one step at a time</p>
</footer>
