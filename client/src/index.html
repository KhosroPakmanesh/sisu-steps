<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://accounts.google.com https://oauth2.googleapis.com https://www.googleapis.com; frame-src https://accounts.google.com; form-action 'self'"
    />
    <base href="/" />
    <script src="runtime-config.js"></script>
    <title>Sisu Steps · Finnish exercise book</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      html {
        min-width: 320px;
        background: #d8d1c3;
      }

      body {
        margin: 0;
      }

      app-root {
        display: block;
        min-height: 100dvh;
      }

      app-root[inert] {
        visibility: hidden;
      }

      .app-boot,
      .app-boot * {
        box-sizing: border-box;
      }

      .app-boot {
        position: fixed;
        z-index: 100;
        inset: 0;
        display: grid;
        min-height: 100dvh;
        place-items: center;
        padding: 1rem;
        background: var(--surface-desk, #d8d1c3);
        color: var(--text-secondary, #625e57);
        font-family: var(--font-body, 'Segoe UI', 'Trebuchet MS', system-ui, sans-serif);
      }

      .app-boot__card {
        position: relative;
        display: grid;
        justify-items: center;
        gap: 1rem;
        width: min(100%, 42rem);
        padding: 3rem;
        border: 1px dashed var(--border-control, #beb19c);
        border-left: 0.32rem solid transparent;
        border-radius: 0.08rem;
        background-color: var(--surface-raised, #fffaf0);
        background-image:
          linear-gradient(
            to right,
            transparent 1.8rem,
            var(--notebook-margin, rgb(160 78 69 / 27%)) 1.8rem 1.86rem,
            transparent 0
          ),
          repeating-linear-gradient(
            to bottom,
            transparent 0 1.7rem,
            var(--notebook-rule, rgb(67 109 122 / 13%)) 1.7rem 1.76rem
          );
        clip-path: polygon(0.2rem 0, 98% 0.12rem, 100% 96%, 96% 100%, 2% 98%, 0 0.4rem);
        box-shadow: none;
        filter: drop-shadow(0.25rem 0.32rem 0 var(--paper-edge, #d9cfbd))
          drop-shadow(0.45rem 0.65rem 0.7rem var(--notebook-shadow, rgb(48 44 36 / 18%)));
        text-align: center;
        transform: rotate(-0.2deg);
      }

      .app-boot__card::before {
        position: absolute;
        top: 0.2rem;
        left: 50%;
        width: 4.6rem;
        height: 0.85rem;
        background: var(--paper-tape, rgb(217 185 111 / 50%));
        content: '';
        transform: translateX(-50%) rotate(1deg);
      }

      .app-boot[hidden] {
        display: none;
      }

      .app-boot__pencil {
        position: relative;
        width: 3.5rem;
        height: 0.6rem;
        border-radius: 0.1rem;
        background: linear-gradient(
          90deg,
          var(--material-amber, #d9b96f),
          var(--red-pencil, #a04e45)
        );
        box-shadow: 0 0.2rem 0 var(--notebook-shadow, rgb(48 44 36 / 18%));
        animation: app-boot-pencil 1.2s ease-in-out infinite alternate;
      }

      .app-boot__pencil::after {
        position: absolute;
        right: -1.1rem;
        border-block: 0.3rem solid transparent;
        border-left: 1.15rem solid var(--stone-200, #d8cdb9);
        content: '';
      }

      .app-boot__card p {
        margin: 0;
        line-height: 1.65;
      }

      @keyframes app-boot-pencil {
        from {
          transform: translateX(-0.4rem);
        }

        to {
          transform: translateX(0.4rem);
        }
      }

      @media (prefers-color-scheme: dark) {
        html {
          background: #181d1c;
        }

        .app-boot {
          background: #181d1c;
          color: #b8b4a9;
        }

        .app-boot__card {
          border-color: #5b6661;
          background: #2c3331;
          background-image:
            linear-gradient(
              to right,
              transparent 1.8rem,
              rgb(211 138 129 / 30%) 1.8rem 1.86rem,
              transparent 0
            ),
            repeating-linear-gradient(
              to bottom,
              transparent 0 1.7rem,
              rgb(105 154 166 / 17%) 1.7rem 1.76rem
            );
          filter: drop-shadow(0.25rem 0.32rem 0 #303735)
            drop-shadow(0.45rem 0.65rem 0.7rem rgb(0 0 0 / 35%));
        }

        .app-boot__card::before {
          background: rgb(155 123 66 / 50%);
        }

        .app-boot__pencil {
          background: linear-gradient(90deg, #9b7b42, #d38a81);
          box-shadow: 0 0.2rem 0 rgb(0 0 0 / 35%);
        }

        .app-boot__pencil::after {
          border-left-color: #46504c;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-boot__pencil {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <app-root inert aria-busy="true" aria-hidden="true"></app-root>
    <div class="app-boot" id="app-boot" role="status" aria-live="polite">
      <div class="app-boot__card">
        <span class="app-boot__pencil" aria-hidden="true"></span>
        <p>Opening your exercise book…</p>
      </div>
    </div>
  </body>
</html>
