<dialog
  #dialog
  class="modal-sheet confirmation-sheet"
  tabindex="-1"
  aria-labelledby="confirmation-title"
  [attr.aria-describedby]="
    request()?.details?.length
      ? 'confirmation-message confirmation-details'
      : 'confirmation-message'
  "
  (cancel)="cancel($event)"
  (click)="dismissFromBackdrop($event)"
  (keydown.escape)="cancel($event)"
>
  @if (request(); as details) {
    <button
      #closeButton
      class="modal-sheet__close"
      type="button"
      [attr.aria-label]="details.closeLabel ?? 'Cancel clearing history'"
      autofocus
      (click)="cancel()"
    >
      <span aria-hidden="true"></span>
    </button>
    <header class="modal-sheet__header">
      <p class="card-kicker">{{ details.eyebrow }}</p>
      <h2 id="confirmation-title">{{ details.title }}</h2>
    </header>
    <p id="confirmation-message">{{ details.message }}</p>
    @if (details.details?.length) {
      <ul id="confirmation-details" class="confirmation-details">
        @for (detail of details.details; track detail) {
          <li>{{ detail }}</li>
        }
      </ul>
    }
    <div class="modal-sheet__actions confirmation-actions">
      <button class="button danger" type="button" (click)="confirm()">
        {{ details.confirmLabel }}
      </button>
    </div>
  }
</dialog>
