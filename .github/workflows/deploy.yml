name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Setup npm
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Validate client
        working-directory: ./client
        run: npm run check

      - name: Build Angular
        working-directory: ./client
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
        run: npm run build -- --configuration production --base-href "/sisu-steps/"

      - name: Find Angular build output
        id: output
        shell: bash
        run: |
          INDEX_FILE="$(find client/dist -type f -name index.html -not -path '*/server/*' | head -n 1)"

          if [ -z "$INDEX_FILE" ]; then
            echo "Could not find Angular index.html"
            exit 1
          fi

          SITE_DIR="$(dirname "$INDEX_FILE")"

          echo "Publishing: $SITE_DIR"
          echo "dir=$SITE_DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare single-page fallback
        run: |
          cp "${{ steps.output.outputs.dir }}/index.html" "${{ steps.output.outputs.dir }}/404.html"
          touch "${{ steps.output.outputs.dir }}/.nojekyll"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.output.outputs.dir }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
