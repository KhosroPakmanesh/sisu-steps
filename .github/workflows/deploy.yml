name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Setup npm
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Validate client
        working-directory: ./client
        run: npm run check

      - name: Build Angular
        working-directory: ./client
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
        run: npm run build -- --configuration production --base-href "/sisu-steps/"

      - name: Validate GitHub Pages artifact
        run: |
          SITE_DIR="client/dist/sisu-steps/browser"
          test -f "$SITE_DIR/index.html"
          test -f "$SITE_DIR/runtime-config.js"
          test -f "$SITE_DIR/privacy/index.html"
          test -f "$SITE_DIR/terms/index.html"
          test -n "$(find "$SITE_DIR" -maxdepth 1 -type f -name 'main-*.js' -print -quit)"
          test -n "$(find "$SITE_DIR" -maxdepth 1 -type f -name 'styles-*.css' -print -quit)"

      - name: Prepare single-page fallback
        run: |
          cp client/dist/sisu-steps/browser/index.html client/dist/sisu-steps/browser/404.html
          touch client/dist/sisu-steps/browser/.nojekyll

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist/sisu-steps/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
